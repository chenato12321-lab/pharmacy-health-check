<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九種體質自我檢測</title>
<meta name="description" content="回答 20 個生活狀態問題,約 3–5 分鐘,了解最近的身體傾向與日常調養方向。藥師衛教參考工具,非醫療診斷。">
<meta property="og:title" content="九種體質自我檢測">
<meta property="og:description" content="3–5 分鐘,了解最近的身體傾向與日常調養方向。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2f5d50">
<style>
:root{
  --bg:#f7f2e8; --card:#fffdf8; --ink:#2a2823; --muted:#6b665c; --line:#e4dccb;
  --green:#2f5d50; --green-d:#234a3f; --accent:#b5653a; --soft:#eef3ee;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); line-height:1.75; font-size:16px;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif; line-height:1.4; margin:0}
p{margin:0}
.wrap{max-width:560px; margin:0 auto; padding:20px 16px 56px}
[hidden]{display:none !important}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 20px}
.eyebrow{font-size:13px; letter-spacing:.12em; color:var(--green); font-weight:600}
h1{font-size:30px; margin:6px 0 12px; color:var(--green-d)}
.lead{color:var(--ink); margin-bottom:16px}
.notes{margin:0 0 20px; padding:14px 16px 14px 34px; background:var(--soft); border-radius:12px; color:#33433d; font-size:15px}
.notes li{margin:2px 0}
.btn{
  display:block; width:100%; min-height:52px; padding:12px 18px; border-radius:14px; border:1px solid var(--green);
  background:var(--green); color:#fff; font:inherit; font-weight:600; font-size:17px; text-align:center;
  text-decoration:none; cursor:pointer; transition:background .15s, transform .1s;
}
.btn:hover{background:var(--green-d)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent; color:var(--green-d)}
.btn.ghost:hover{background:var(--soft)}
.btn+.btn{margin-top:10px}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible,summary:focus-visible{outline:3px solid #e0a35c; outline-offset:2px}
.consent{display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--muted); margin:0 0 16px}
.consent input{margin-top:5px; width:18px; height:18px; flex:none}
.fine{font-size:13px; color:var(--muted); margin-top:16px; line-height:1.6}

/* quiz */
.top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:15px; color:var(--muted)}
.link{background:none; border:0; padding:8px 4px; font:inherit; color:var(--green-d); cursor:pointer}
.bar{height:8px; background:#e8dfcc; border-radius:99px; overflow:hidden; margin-bottom:16px}
.bar i{display:block; height:100%; width:0; background:var(--green); border-radius:99px; transition:width .25s}
.hint{font-size:13px; color:var(--muted); margin-bottom:8px}
#q-text{font-size:22px; margin-bottom:22px; outline:none}
.opts{display:grid; gap:10px}
.opt{
  min-height:56px; padding:12px 16px; border-radius:14px; border:1.5px solid var(--line); background:#fff;
  font:inherit; font-size:17px; color:var(--ink); text-align:left; cursor:pointer; transition:border-color .15s, background .15s;
}
.opt:hover{border-color:var(--green)}
.opt[aria-pressed="true"]{border-color:var(--green); background:var(--soft); font-weight:600}

/* result */
.hero{text-align:center; padding:28px 20px}
.hero .small{font-size:14px; color:var(--muted)}
.hero h2{font-size:32px; color:var(--green-d); margin:6px 0 8px}
.hero .sub{color:var(--muted); font-size:15px}
.type{background:var(--card); border:1px solid var(--line); border-left:6px solid var(--c); border-radius:16px; margin-top:14px; overflow:hidden}
.type summary{display:flex; gap:14px; align-items:center; padding:16px 18px; cursor:pointer; list-style:none}
.type summary::-webkit-details-marker{display:none}
.seal{
  flex:none; width:48px; height:48px; border-radius:50%; background:var(--c); color:#fff;
  display:grid; place-items:center; font:700 22px/1 "Noto Serif TC","Songti TC",serif;
}
.type .ttl{flex:1}
.type .ttl b{display:block; font-family:"Noto Serif TC","Songti TC",serif; font-size:20px}
.type .ttl span{font-size:14px; color:var(--muted)}
.type summary::after{content:"+"; font-size:24px; color:var(--muted); width:20px; text-align:center}
.type[open] summary::after{content:"–"}
.tbody{padding:2px 18px 20px}
.tbody h4{margin:18px 0 4px; font-size:15px; color:var(--c)}
.tbody ul{margin:0; padding-left:20px}
.tbody li{margin:1px 0}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.chips span{background:#f3ece0; border-radius:99px; padding:3px 12px; font-size:14px}
.caution{margin-top:18px; padding:12px 14px; background:#fbf1e6; border-radius:10px; font-size:14px; color:#6b4a2b}
.panel{margin-top:14px}
.panel h3{font-size:18px; margin-bottom:12px}
.score-row{display:grid; grid-template-columns:64px 1fr 36px; gap:10px; align-items:center; font-size:14px; margin:7px 0}
.track{position:relative; height:10px; background:#eee6d6; border-radius:99px}
.track i{position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:#b9b2a2}
.score-row.hi .track i{background:var(--green)}
.track em{position:absolute; left:60%; top:-4px; bottom:-4px; width:2px; background:#c9a46a}
.score-row .v{text-align:right; color:var(--muted)}
.legend{font-size:12px; color:var(--muted); margin-top:8px}
.cta p{margin-bottom:14px}
footer.disc{margin-top:20px; font-size:13px; color:var(--muted); line-height:1.7; text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<main class="wrap">

  <!-- 首頁 -->
  <section id="screen-intro" class="card">
    <p class="eyebrow" id="eyebrow">藥師衛教小工具</p>
    <h1>九種體質自我檢測</h1>
    <p class="lead">回答 20 個生活狀態的問題,約 3–5 分鐘,了解你最近的身體傾向,以及日常調養的方向。</p>
    <ul class="notes">
      <li>請依「最近三個月」的感受作答</li>
      <li>沒有標準答案,憑第一直覺選就好</li>
      <li>適用 18 歲以上成人</li>
    </ul>
    <label class="consent" id="consent-row" hidden>
      <input type="checkbox" id="consent">
      <span>我同意以匿名方式回傳作答結果,供藥局改善衛教內容(不含姓名、電話等個人資料)。</span>
    </label>
    <button class="btn" id="start" type="button">開始檢測</button>
    <p class="fine">本工具為生活調養的衛教參考,<b>不是醫療診斷</b>,也無法取代醫師或中醫師的問診。若有不適,請就醫諮詢。</p>
  </section>

  <!-- 題目 -->
  <section id="screen-quiz" hidden>
    <div class="top">
      <button class="link" id="back" type="button">← 上一題</button>
      <span id="count" aria-live="polite">1 / 20</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="1" id="bar"><i id="fill"></i></div>
    <div class="card">
      <p class="hint">請依最近三個月的狀況選擇</p>
      <h2 id="q-text" tabindex="-1"></h2>
      <div class="opts" id="opts"></div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="screen-result" hidden>
    <div class="card hero" id="hero"></div>
    <div id="types"></div>
    <div class="card panel" id="scores"></div>
    <div class="card panel cta" id="cta"></div>
    <button class="btn ghost" id="retake" type="button" style="margin-top:14px">重新檢測</button>
    <footer class="disc">
      本結果依你的自評作答產生,僅供生活調養與衛教參考,<b>非醫療診斷</b>,不能取代醫師或中醫師的問診。<br>
      孕婦、哺乳中、慢性病患者或正在服藥者,調整飲食或使用保健品前請先諮詢醫師或藥師。
    </footer>
  </section>

</main>

    life:'每天安排固定的放鬆時間:戶外散步、腹式呼吸、和朋友聊聊。規律運動對情緒穩定很有幫助。',
    foods:['玫瑰花','茉莉花','陳皮','柚子','薄荷'],
    caution:'若情緒低落或焦慮持續超過兩週、影響工作與睡眠,請尋求身心科或心理諮商協助。需要有人聊聊時,可撥打 1925 安心專線(24 小時免費)。' },
  tebing:{ name:'特稟質', seal:'稟', c:'#a0527a', short:'特稟',
    tag:'較敏感,環境變化易不適',
    desc:'對特定食物、藥物或環境較敏感的傾向。常見換季打噴嚏、鼻塞、皮膚癢或起蕁麻疹。',
    feat:['換季容易打噴嚏、鼻塞','皮膚容易癢、起蕁麻疹','對特定食物或藥物過敏'],
    yi:'以均衡、少加工的食物為主,可用「飲食紀錄」找出自己的誘發因素。',
    shao:'已知的過敏原;一次嘗試多種新食材或新保健品。',
    life:'規律作息、避免過度疲勞。定期清洗寢具、減少塵蟎,換季前提早做好防護。',
    foods:[],
    foodNote:'此類型不建議自行嘗試新的草本或保健品,使用前請先諮詢藥師。',
    caution:'若出現呼吸困難、喉嚨緊縮、臉或嘴唇腫脹,可能是嚴重過敏反應,請立即就醫或撥打 119。已確診的過敏疾病,請依醫囑治療。' },
  pinghe:{ name:'平和質', seal:'和', c:'#2f5d50', short:'平和',
    tag:'狀態穩定,持續維持',
    desc:'目前身體狀態相對穩定,精神、睡眠、食慾與排便大致正常。這是很好的基礎,重點是持續維持。',
    feat:['精神與體力穩定','睡眠、食慾、排便大致正常','不太容易感冒'],
    yi:'均衡飲食,依季節選擇當季蔬果,三餐定時定量。',
    shao:'長期熬夜、暴飲暴食或極端飲食法。',
    life:'維持規律作息與運動習慣,季節轉換時適度調整衣物與作息。',
    foods:['當季蔬果','全穀雜糧','豆類','堅果'],
    caution:'體質會隨年齡、壓力與季節改變,建議每隔一段時間(例如換季)重新檢視自己的狀態。' }
};
var UNCLEAR = { name:'特徵不明顯', seal:'衡', c:'#6b7a74', tag:'介於各類型之間',
  desc:'你的作答沒有特別集中在某一種體質,可能屬於輕微混合,或是目前狀態相對穩定。',
  feat:['各項分數都沒有明顯偏高','可能有輕微、不集中的小困擾'],
  yi:'以均衡飲食為基礎,三餐定時定量,多蔬菜、適量蛋白質。',
  shao:'極端節食、長期熬夜、過量含糖飲料。',
  life:'維持規律作息與適度運動。若有特定困擾(例如睡眠、腸胃、皮膚),可帶著具體問題到店與藥師聊聊。',
  foods:[],
  caution:'若有持續的不適症狀,請就醫檢查,不要只依自我檢測的結果判斷。' };

/* ===== 計分 ===== */
function computeResult(ans){
  var scores = {}, k;
  for(k in TYPES){ scores[k] = 0; }
  Q.forEach(function(q){ scores[q.g] += (ans[q.id] || 0) * (q.w || 1); });
  var biased = BIASED.filter(function(k){ return scores[k] >= THRESH; })
    .sort(function(a,b){ return scores[b]-scores[a] || BIASED.indexOf(a)-BIASED.indexOf(b); });
  var mode = biased.length ? 'biased' : (scores.pinghe >= THRESH ? 'pinghe' : 'unclear');
  return { scores:scores, biased:biased, mode:mode };
}

/* ===== 介面 ===== */
function $(s){ return document.querySelector(s); }
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function fmt(n){ return n % 1 === 0 ? String(n) : n.toFixed(1); }
function safeUrl(u){ return /^https:\/\//i.test(u) ? u : ''; }
var pName = CONFIG.pharmacyName || '藥局';
var qById = {}; Q.forEach(function(q){ qById[q.id]=q; });
var state = { idx:0, ans:{}, lock:false };
var screens = { intro:$('#screen-intro'), quiz:$('#screen-quiz'), result:$('#screen-result') };

function show(name){
  Object.keys(screens).forEach(function(k){ screens[k].hidden = (k!==name); });
  window.scrollTo(0,0);
}

function renderQuestion(){
  var id = ORDER[state.idx], q = qById[id], labels = q.labels || L_DEFAULT;
  $('#count').textContent = (state.idx+1) + ' / ' + ORDER.length;
  $('#fill').style.width = ((state.idx+1)/ORDER.length*100) + '%';
  $('#bar').setAttribute('aria-valuenow', state.idx+1);
  $('#q-text').textContent = q.t;
  var box = $('#opts'); box.innerHTML = '';
  labels.forEach(function(lb, v){
    var b = el('button','opt', lb);
    b.type = 'button';
    b.setAttribute('aria-pressed', state.ans[id]===v ? 'true':'false');
    b.addEventListener('click', function(){ choose(v); });
    box.appendChild(b);
  });
  state.lock = false;
}

function choose(v){
  if(state.lock) return;
  state.lock = true;
  var id = ORDER[state.idx];
  state.ans[id] = v;
  Array.prototype.forEach.call($('#opts').children, function(b,i){ b.setAttribute('aria-pressed', i===v?'true':'false'); });
  setTimeout(function(){
    if(state.idx < ORDER.length-1){ state.idx++; renderQuestion(); $('#q-text').focus({preventScroll:true}); }
    else { finish(); }
  }, 220);
}

function listBlock(title, arr){
  var f = document.createDocumentFragment();
  f.appendChild(el('h4', null, title));
  var ul = el('ul'); arr.forEach(function(t){ ul.appendChild(el('li', null, t)); });
  f.appendChild(ul); return f;
}
function textBlock(title, text){
  var f = document.createDocumentFragment();
  f.appendChild(el('h4', null, title)); f.appendChild(el('p', null, text)); return f;
}

function typeCard(T, open){
  var d = el('details','type'); d.style.setProperty('--c', T.c);
  if(open) d.open = true;
  var s = el('summary');
  s.appendChild(el('span','seal',T.seal));
  var t = el('div','ttl'); t.appendChild(el('b',null,T.name)); t.appendChild(el('span',null,T.tag));
  s.appendChild(t); d.appendChild(s);
  var b = el('div','tbody');
  b.appendChild(el('p',null,T.desc));
  b.appendChild(listBlock('常見特徵', T.feat));
  b.appendChild(textBlock('飲食方向', '宜:' + T.yi));
  b.lastChild.appendChild(el('p',null,'少:' + T.shao));
  b.appendChild(textBlock('作息與運動', T.life));
  if(T.foods && T.foods.length){
    b.appendChild(el('h4',null,'日常食材參考'));
    var c = el('div','chips'); T.foods.forEach(function(x){ c.appendChild(el('span',null,x)); });
    b.appendChild(c);
  } else if(T.foodNote){
    b.appendChild(textBlock('食材提醒', T.foodNote));
  }
  b.appendChild(el('div','caution','⚠ 提醒:' + T.caution));
  d.appendChild(b); return d;
}

function renderScores(res){
  var box = $('#scores'); box.innerHTML = '';
  box.appendChild(el('h3',null,'各體質分數一覽'));
  BIASED.concat(['pinghe']).forEach(function(k){
    var v = res.scores[k], hi = (k==='pinghe') ? false : v>=THRESH;
    var row = el('div','score-row' + (hi?' hi':''));
    row.appendChild(el('span',null,TYPES[k].short));
    var tr = el('div','track'), bar = el('i'); bar.style.width = Math.min(v/5*100,100)+'%';
    tr.appendChild(bar); if(k!=='pinghe') tr.appendChild(el('em'));
    row.appendChild(tr); row.appendChild(el('span','v',fmt(v)));
    box.appendChild(row);
  });
  box.appendChild(el('p','legend','金色線為「明顯傾向」參考線(3 分)。平和質分數越高,代表目前狀態越穩定。'));
}

function renderCta(){
  var box = $('#cta'); box.innerHTML = '';
  box.appendChild(el('h3',null,'想更了解適合自己的調養方式?'));
  box.appendChild(el('p',null,'每個人的生活作息、用藥與健康狀況都不同。歡迎到「' + pName + '」與藥師聊聊,幫你把這份結果對照到日常生活。'));
  var line = safeUrl(CONFIG.lineUrl), book = safeUrl(CONFIG.bookingUrl);
  if(line){ var a = el('a','btn','用 LINE 詢問藥師'); a.href=line; a.target='_blank'; a.rel='noopener'; box.appendChild(a); }
  if(book){ var b = el('a','btn ghost','預約到店諮詢'); b.href=book; b.target='_blank'; b.rel='noopener'; box.appendChild(b); }
}

function finish(){
  var res = computeResult(state.ans);
  var hero = $('#hero'), types = $('#types'); hero.innerHTML=''; types.innerHTML='';
  var keys = [];
  if(res.mode==='biased'){
    keys = res.biased.slice(0, MAX_SHOWN);
    hero.appendChild(el('p','small','你目前的體質傾向'));
    hero.appendChild(el('h2',null, TYPES[keys[0]].name));
    if(keys.length>1){
      hero.appendChild(el('p','sub','兼有:' + keys.slice(1).map(function(k){return TYPES[k].name;}).join('、') + '傾向'));
    } else {
      hero.appendChild(el('p','sub', TYPES[keys[0]].tag));
    }
    keys.forEach(function(k,i){ types.appendChild(typeCard(TYPES[k], i===0)); });
    if(res.biased.length > MAX_SHOWN || res.biased.length >= 4){
      types.appendChild(el('div','caution','你有多個類型的分數偏高(共 ' + res.biased.length + ' 項),此處列出分數最高的 ' + keys.length + ' 項。若同時有多種不適且持續存在,建議就醫評估,或到店請藥師協助釐清。'));
      types.lastChild.style.marginTop='14px';
    }
  } else if(res.mode==='pinghe'){
    hero.appendChild(el('p','small','你目前的體質傾向'));
    hero.appendChild(el('h2',null,TYPES.pinghe.name));
    hero.appendChild(el('p','sub',TYPES.pinghe.tag));
    types.appendChild(typeCard(TYPES.pinghe, true));
  } else {
    hero.appendChild(el('p','small','你目前的體質傾向'));
    hero.appendChild(el('h2',null,UNCLEAR.name));
    hero.appendChild(el('p','sub',UNCLEAR.tag));
    types.appendChild(typeCard(UNCLEAR, true));
  }
  renderScores(res); renderCta(); report(res, keys);
  show('result');
}

function report(res, keys){
  var cb = $('#consent');
  if(!CONFIG.sheetWebhook || !cb || !cb.checked) return;
  try{
    fetch(CONFIG.sheetWebhook, { method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ time:new Date().toISOString(), answers:state.ans, scores:res.scores, mode:res.mode, types:keys }) });
  }catch(e){}
}

function reset(){ state.idx=0; state.ans={}; state.lock=false; show('intro'); }

/* ===== 事件 ===== */
if(CONFIG.pharmacyName){ $('#eyebrow').textContent = CONFIG.pharmacyName + '・藥師衛教小工具'; }
if(CONFIG.sheetWebhook){ $('#consent-row').hidden = false; }
$('#start').addEventListener('click', function(){ state.idx=0; state.ans={}; renderQuestion(); show('quiz'); $('#q-text').focus({preventScroll:true}); });
$('#back').addEventListener('click', function(){
  if(state.idx===0){ show('intro'); return; }
  state.idx--; renderQuestion();
});
$('#retake').addEventListener('click', reset);
document.addEventListener('keydown', function(e){
  if(screens.quiz.hidden) return;
  var n = parseInt(e.key,10);
  if(n>=1 && n<=3){ choose(n-1); }
});
})();
</script>
</body>
